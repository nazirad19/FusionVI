benchmark: totalVI Figure 3 missing-protein imputation
paper_dataset: spleen_lymph_111.h5ad
source_batch: SLN111-D1
target_batch: SLN111-D2
n_genes: 4005
n_proteins: 110
n_latent: 20
totalvi_hidden: 256
fusion_branch_hidden: 128
max_epochs: 500
early_stopping_patience: 45
batch_size: 256
learning_rate: 0.004
posterior_samples: 25
paper_initializations: 30
executed_seeds:
  - 2026
  - 2027
  - 2028
  - 2029
primary_metric: RMSLE on log1p protein abundance
secondary_biological_metrics:
  - foreground RMSLE
  - within-cell-type Spearman
  - AUROC for source-defined positive calls on CD4, CD8 and CD19

# Encoder controls. The decoder, likelihoods, latent size, optimizer and data
# split stay fixed. Tier 1 addresses width, parameter count and missing-panel
# handling; Tier 2 tests capacity and gate ablations.
arms:
  totalvi:            {encoder: joint,           hidden: 256, tier: 0}
  fusionvi:           {encoder: fusion,          hidden: 128, gate: learned, tier: 0}
  totalvi_w128:       {encoder: joint,           hidden: 128, tier: 1}
  totalvi_pmatch:     {encoder: joint,           hidden: 70,  tier: 1}
  totalvi_avail_w128: {encoder: joint_available, hidden: 128, tier: 1}
  fusionvi_pmatch:    {encoder: fusion,          hidden: 406, gate: learned, tier: 2}
  fusionvi_fixedgate: {encoder: fusion,          hidden: 128, gate: fixed,   tier: 2}
  fusionvi_rnaonly:   {encoder: fusion,          hidden: 128, gate: rna_only, tier: 2}
  totalvi_moddrop:    {encoder: joint_moddrop,   hidden: 256, modality_dropout: 0.30, tier: 3}
  totalvi_w128_moddrop: {encoder: joint_moddrop, hidden: 128, modality_dropout: 0.30, tier: 3}
  fusionvi_moddrop:   {encoder: fusion,          hidden: 128, gate: learned, modality_dropout: 0.30, tier: 3}
  # Frozen follow-up sweep. These arms differ from published totalVI only in
  # the fraction of source cells whose protein encoder input is hidden while
  # their measured proteins remain targets of the protein likelihood.
  totalvi_moddrop_p25: {encoder: joint_moddrop,  hidden: 256, modality_dropout: 0.25, tier: 3}
  totalvi_moddrop_p50: {encoder: joint_moddrop,  hidden: 256, modality_dropout: 0.50, tier: 3}
  totalvi_moddrop_p75: {encoder: joint_moddrop,  hidden: 256, modality_dropout: 0.75, tier: 3}

control_seeds:
  - 2026
  - 2027
  - 2028
  - 2029
  - 2030
  - 2031
  - 2032
  - 2033
  - 2034
  - 2035
  - 2036
  - 2037
  - 2038
  - 2039
  - 2040
  - 2041

# Development splits never contain the real target mouse. The SLN206 partial
# benchmark tests FusionVI in the setting it was designed for: some proteins
# remain observed on the target cells while the rest are imputed.
benchmarks:
  paper:
    data: paper_figure3_missing_protein.h5ad
    source_batch: SLN111-D1
    target_batch: SLN111-D2
    panel_available_batches: [SLN111-D1]
    stage: final
  dev_random:
    data: dev_sln111_random.h5ad
    source_batch: SLN111-D1
    target_batch: DEV-HOLDOUT
    panel_available_batches: [SLN111-D1]
    stage: development
  dev_tissue:
    data: dev_sln111_tissue.h5ad
    source_batch: SLN111-D1
    target_batch: DEV-HOLDOUT
    panel_available_batches: [SLN111-D1]
    stage: development
  sln206_partial:
    data: sln206_partial_panel.h5ad
    source_batch: SLN206-D1
    target_batch: SLN206-D2
    panel_available_batches: [SLN206-D1, SLN206-D2]
    stage: final
  dev_sln206_partial:
    data: dev_sln206_partial.h5ad
    source_batch: SLN206-D1
    target_batch: DEV-HOLDOUT
    panel_available_batches: [SLN206-D1, DEV-HOLDOUT]
    stage: development
dev_holdout_fraction: 0.2
